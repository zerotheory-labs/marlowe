name: Build Native OS Bundles (macOS, Windows, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
          - label: Windows-x64
            os: windows-latest
            platform: win32
            arch: x64
          - label: Linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux native headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libsecret-1-dev

      - name: Install dependencies & compile native node-pty for host OS
        run: npm ci

      - name: Run unit & security gate test suite on ${{ matrix.label }}
        run: npm test

      - name: Package native Marlowe desktop bundle
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          node scripts/package.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Archive & checksum (${{ matrix.label }})
        shell: bash
        run: |
          mkdir -p dist-assets
          BUNDLE_DIR="Marlowe-${{ matrix.platform }}-${{ matrix.arch }}"
          ARCHIVE_BASE="Marlowe-${{ matrix.label }}-${{ github.ref_name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "release/${BUNDLE_DIR}/Marlowe.app" "dist-assets/${ARCHIVE_BASE}.zip"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'release/${BUNDLE_DIR}/*' -DestinationPath 'dist-assets/${ARCHIVE_BASE}.zip' -Force"
          else
            tar -C release -czf "dist-assets/${ARCHIVE_BASE}.tar.gz" "${BUNDLE_DIR}"
          fi
          (cd dist-assets && sha256sum * > "SHA256SUMS-${{ matrix.label }}.txt" 2>/dev/null || shasum -a 256 * > "SHA256SUMS-${{ matrix.label }}.txt")
          ls -lh dist-assets

      - name: Upload ${{ matrix.label }} bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marlowe-${{ matrix.label }}
          path: dist-assets/*
          retention-days: 30

      - name: Attach bundle & checksum to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-assets/* --repo "${{ github.repository }}" --clobber
