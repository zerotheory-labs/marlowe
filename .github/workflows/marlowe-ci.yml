name: Marlowe CI Security Guard

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  marlowe-guard:
    name: Marlowe Security Verdict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Marlowe CI / Guard
        id: marlowe
        uses: zerotheory-labs/marlowe-ci@v0.1.0
        with:
          mode: diff
          fail-on: high
          sarif-file: marlowe.sarif
          comment-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('marlowe.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: marlowe.sarif
          category: marlowe-ci
