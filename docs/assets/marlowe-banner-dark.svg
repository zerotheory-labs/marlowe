<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-label="Marlowe. — Security for AI. By Zero Theory Labs.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161512"/>
      <stop offset="100%" stop-color="#100f0d"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="918" height="218" rx="16" fill="url(#bg)" stroke="#2b2924" stroke-width="1.5"/>
  <circle cx="820" cy="40" r="190" fill="url(#mintGlow)"/>

  <!-- Subtle engineering grid hairlines on right -->
  <line x1="612" y1="1" x2="612" y2="219" stroke="#22201c" stroke-width="1"/>
  <line x1="612" y1="158" x2="919" y2="158" stroke="#22201c" stroke-width="1"/>

  <!-- Zero Theory Labs eyebrow lockup -->
  <g transform="translate(44, 34)">
    <circle cx="9" cy="9" r="8" fill="none" stroke="#a6a095" stroke-width="1.5"/>
    <line x1="0" y1="17.5" x2="18" y2="17.5" stroke="#a6a095" stroke-width="1.5"/>
    <text x="27" y="13" fill="#a6a095" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.2">ZERO THEORY LABS  ·  V0.4</text>
  </g>

  <!-- Signature m. tile + Marlowe. wordmark -->
  <g transform="translate(44, 72)">
    <rect x="0" y="4" width="54" height="54" rx="12" fill="#f2efe8"/>
    <text x="11" y="42" fill="#131210" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="36" font-weight="600" letter-spacing="-1">m</text>
    <circle cx="44" cy="39" r="3.6" fill="#179b61"/>

    <text x="72" y="47" fill="#f5f2eb" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="54" font-weight="500" letter-spacing="-1.4">Marlowe<tspan fill="#3ddc97">.</tspan></text>
  </g>

  <!-- Tagline & subcopy -->
  <text x="44" y="158" fill="#3ddc97" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="20" font-style="italic">Security for AI. A little more careful.</text>
  <text x="44" y="185" fill="#9e988d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Native shells, 9-CLI convergence &amp; reachability graphs, Codebase DNA, and host-enforced approval gates.</text>

  <!-- Right panel: Zero Theory Labs dot-matrix DNA motif -->
  <g transform="translate(648, 30)">
    <!-- Row 1 -->
    <circle cx="168" cy="8" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="192" cy="8" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="216" cy="8" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <!-- Row 2 -->
    <circle cx="144" cy="30" r="3.5" fill="#3ddc97" opacity="0.8"/>
    <circle cx="168" cy="30" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="192" cy="30" r="4.5" fill="#f26d5b"/>
    <circle cx="216" cy="30" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <!-- Row 3 -->
    <circle cx="120" cy="52" r="3.5" fill="#f2efe8" opacity="0.35"/>
    <circle cx="144" cy="52" r="3.5" fill="#3ddc97" opacity="0.85"/>
    <circle cx="168" cy="52" r="4" fill="#e5c07b"/>
    <circle cx="192" cy="52" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="216" cy="52" r="3.5" fill="#6ea8fe"/>
    <!-- Row 4 -->
    <circle cx="96" cy="74" r="3.5" fill="#f2efe8" opacity="0.25"/>
    <circle cx="120" cy="74" r="3.5" fill="#f2efe8" opacity="0.4"/>
    <circle cx="144" cy="74" r="3.5" fill="#3ddc97" opacity="0.85"/>
    <circle cx="168" cy="74" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="192" cy="74" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="216" cy="74" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <!-- Row 5 -->
    <circle cx="72" cy="96" r="3.5" fill="#f2efe8" opacity="0.2"/>
    <circle cx="96" cy="96" r="3.5" fill="#f2efe8" opacity="0.3"/>
    <circle cx="120" cy="96" r="3.5" fill="#3ddc97" opacity="0.7"/>
    <circle cx="144" cy="96" r="3.5" fill="#3ddc97" opacity="0.85"/>
    <circle cx="168" cy="96" r="3.5" fill="#6ea8fe"/>
    <circle cx="192" cy="96" r="3.5" fill="#3ddc97" opacity="0.95"/>
    <circle cx="216" cy="96" r="3.5" fill="#3ddc97" opacity="0.95"/>
  </g>

  <!-- Telemetry strip bottom-right -->
  <text x="634" y="182" fill="#a6a095" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.1">9 LOCAL CLIS · ENTROPY DNA</text>
  <text x="634" y="199" fill="#3ddc97" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.1">CSP: connect-src 'none' · O_NOFOLLOW</text>
</svg>
