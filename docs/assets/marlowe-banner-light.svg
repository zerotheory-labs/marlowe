<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-label="Marlowe. — Security for AI. By Zero Theory Labs.">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f4ee"/>
      <stop offset="100%" stop-color="#ece8dd"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="918" height="218" rx="16" fill="url(#bgLight)" stroke="#d1ccc0" stroke-width="1.5"/>

  <!-- Subtle engineering grid hairlines on right -->
  <line x1="612" y1="1" x2="612" y2="219" stroke="#dcd7cb" stroke-width="1"/>
  <line x1="612" y1="158" x2="919" y2="158" stroke="#dcd7cb" stroke-width="1"/>

  <!-- Zero Theory Labs eyebrow lockup -->
  <g transform="translate(44, 34)">
    <circle cx="9" cy="9" r="8" fill="none" stroke="#5b564e" stroke-width="1.5"/>
    <line x1="0" y1="17.5" x2="18" y2="17.5" stroke="#5b564e" stroke-width="1.5"/>
    <text x="27" y="13" fill="#5b564e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.2">ZERO THEORY LABS  ·  V0.4</text>
  </g>

  <!-- Signature m. tile + Marlowe. wordmark -->
  <g transform="translate(44, 72)">
    <rect x="0" y="4" width="54" height="54" rx="12" fill="#131210"/>
    <text x="11" y="42" fill="#f2efe8" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="36" font-weight="600" letter-spacing="-1">m</text>
    <circle cx="44" cy="39" r="3.6" fill="#3ddc97"/>

    <text x="72" y="47" fill="#131210" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="54" font-weight="500" letter-spacing="-1.4">Marlowe<tspan fill="#176b45">.</tspan></text>
  </g>

  <!-- Tagline & subcopy -->
  <text x="44" y="158" fill="#176b45" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="20" font-style="italic">Security for AI. A little more careful.</text>
  <text x="44" y="185" fill="#4f4a43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Native shells, 9-CLI convergence &amp; reachability graphs, Codebase DNA, and host-enforced approval gates.</text>

