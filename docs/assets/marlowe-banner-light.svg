<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="Marlowe. — Security for AI. By Zero Theory Labs.">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f4ee"/>
      <stop offset="100%" stop-color="#ece8dd"/>
    </linearGradient>
    <clipPath id="leftColLight">
      <rect x="0" y="0" width="628" height="264"/>
    </clipPath>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="958" height="262" rx="18" fill="url(#bgLight)" stroke="#d1ccc0" stroke-width="1.5"/>

  <!-- Right telemetry column dividers -->
  <line x1="648" y1="1" x2="648" y2="263" stroke="#dcd7cb" stroke-width="1"/>
  <line x1="648" y1="184" x2="959" y2="184" stroke="#dcd7cb" stroke-width="1"/>

  <!-- Left column -->
  <g clip-path="url(#leftColLight)">
    <!-- Zero Theory Labs eyebrow lockup -->
    <g transform="translate(48, 38)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#5b564e" stroke-width="1.5"/>
      <line x1="0" y1="17.5" x2="18" y2="17.5" stroke="#5b564e" stroke-width="1.5"/>
      <text x="28" y="13" fill="#5b564e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.2">ZERO THEORY LABS  ·  V0.6</text>
    </g>

    <!-- Signature m. tile + Marlowe. wordmark -->
    <g transform="translate(48, 78)">
      <rect x="0" y="2" width="58" height="58" rx="13" fill="#131210"/>
      <text x="9.5" y="42" fill="#f2efe8" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="35" font-weight="600">m</text>
      <circle cx="46.5" cy="39.5" r="3.6" fill="#3ddc97"/>

      <text x="78" y="47" fill="#131210" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="56" font-weight="500" letter-spacing="-1.2">Marlowe<tspan fill="#176b45">.</tspan></text>
    </g>

    <!-- Tagline & two-line subcopy with generous breathing room -->
    <text x="48" y="172" fill="#176b45" font-family="Georgia, 'Newsreader', 'Times New Roman', serif" font-size="20.5" font-style="italic">Security for AI. A little more careful.</text>

    <text x="48" y="204" fill="#4f4a43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Native shells, 10-CLI convergence &amp; attack-reachability maps,</text>
    <text x="48" y="225" fill="#4f4a43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Shannon-entropy Codebase DNA, and host-enforced approval gates.</text>
  </g>

  <!-- Right top panel: Zero Theory Labs dot-matrix DNA motif -->
  <g transform="translate(692, 42)">
    <circle cx="168" cy="8" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="192" cy="8" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="8" r="3.6" fill="#176b45" opacity="0.9"/>

    <circle cx="144" cy="30" r="3.6" fill="#176b45" opacity="0.75"/>
    <circle cx="168" cy="30" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="192" cy="30" r="4.6" fill="#c93b2b"/>
    <circle cx="216" cy="30" r="3.6" fill="#176b45" opacity="0.9"/>

    <circle cx="120" cy="52" r="3.6" fill="#131210" opacity="0.22"/>
    <circle cx="144" cy="52" r="3.6" fill="#176b45" opacity="0.8"/>
    <circle cx="168" cy="52" r="4.2" fill="#b57600"/>
    <circle cx="192" cy="52" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="52" r="3.6" fill="#1f56b5"/>

    <circle cx="96" cy="74" r="3.6" fill="#131210" opacity="0.18"/>
    <circle cx="120" cy="74" r="3.6" fill="#131210" opacity="0.28"/>
    <circle cx="144" cy="74" r="3.6" fill="#176b45" opacity="0.8"/>
    <circle cx="168" cy="74" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="192" cy="74" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="74" r="3.6" fill="#176b45" opacity="0.9"/>

    <circle cx="72" cy="96" r="3.6" fill="#131210" opacity="0.14"/>
    <circle cx="96" cy="96" r="3.6" fill="#131210" opacity="0.22"/>
    <circle cx="120" cy="96" r="3.6" fill="#176b45" opacity="0.65"/>
    <circle cx="144" cy="96" r="3.6" fill="#176b45" opacity="0.8"/>
    <circle cx="168" cy="96" r="3.6" fill="#1f56b5"/>
    <circle cx="192" cy="96" r="3.6" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="96" r="3.6" fill="#176b45" opacity="0.9"/>
  </g>

  <!-- Right bottom telemetry strip -->
  <text x="672" y="213" fill="#5b564e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.0">10 LOCAL CLIS · ENTROPY DNA</text>
  <text x="672" y="234" fill="#176b45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.5">CSP: connect-src 'none' · O_NOFOLLOW</text>
</svg>
