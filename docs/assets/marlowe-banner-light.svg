  <g transform="translate(648, 30)">
    <circle cx="168" cy="8" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="192" cy="8" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="8" r="3.5" fill="#176b45" opacity="0.9"/>

    <circle cx="144" cy="30" r="3.5" fill="#176b45" opacity="0.75"/>
    <circle cx="168" cy="30" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="192" cy="30" r="4.5" fill="#c93b2b"/>
    <circle cx="216" cy="30" r="3.5" fill="#176b45" opacity="0.9"/>

    <circle cx="120" cy="52" r="3.5" fill="#131210" opacity="0.22"/>
    <circle cx="144" cy="52" r="3.5" fill="#176b45" opacity="0.8"/>
    <circle cx="168" cy="52" r="4" fill="#b57600"/>
    <circle cx="192" cy="52" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="52" r="3.5" fill="#1f56b5"/>

    <circle cx="96" cy="74" r="3.5" fill="#131210" opacity="0.18"/>
    <circle cx="120" cy="74" r="3.5" fill="#131210" opacity="0.28"/>
    <circle cx="144" cy="74" r="3.5" fill="#176b45" opacity="0.8"/>
    <circle cx="168" cy="74" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="192" cy="74" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="74" r="3.5" fill="#176b45" opacity="0.9"/>

    <circle cx="72" cy="96" r="3.5" fill="#131210" opacity="0.14"/>
    <circle cx="96" cy="96" r="3.5" fill="#131210" opacity="0.22"/>
    <circle cx="120" cy="96" r="3.5" fill="#176b45" opacity="0.65"/>
    <circle cx="144" cy="96" r="3.5" fill="#176b45" opacity="0.8"/>
    <circle cx="168" cy="96" r="3.5" fill="#1f56b5"/>
    <circle cx="192" cy="96" r="3.5" fill="#176b45" opacity="0.9"/>
    <circle cx="216" cy="96" r="3.5" fill="#176b45" opacity="0.9"/>
  </g>

  <!-- Telemetry strip bottom-right -->
  <text x="634" y="182" fill="#5b564e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.1">9 LOCAL CLIS · ENTROPY DNA</text>
  <text x="634" y="199" fill="#176b45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.1">CSP: connect-src 'none' · O_NOFOLLOW</text>
</svg>
